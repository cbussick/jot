<svg xmlns="http://www.w3.org/2000/svg" width="560" height="510" viewBox="0 0 560 510"><rect width="560" height="510" rx="12" fill="#252a30"/><circle cx="63" cy="65" r="26" fill="#dbd3b7"/><path d="M55 72V56h6c12 0 12 16 0 16Z" stroke="#333a36" fill="none" stroke-width="3"/><g font-family="Arial,sans-serif"><text x="105" y="60" fill="#f8f8f4" font-size="23" font-weight="bold">A note to self</text><text x="105" y="87" fill="#b9bec5" font-size="18">a small reminder</text><g fill="#f8f8f4" font-size="32"><text x="38" y="166">You don’t have to turn</text><text x="38" y="215">every interest into</text><text x="38" y="264">something productive.</text><text x="38" y="334">You can just enjoy things.</text></g><path d="M38 390H522" stroke="#45494e"/><text x="38" y="437" font-size="18" fill="#b9bec5">Saved for a day I need to hear it.</text><path d="M481 425c-16-20-32 2 0 20 32-18 16-40 0-20Z" fill="none" stroke="#b9bec5" stroke-width="2"/></g></svg>
